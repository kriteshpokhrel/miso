name: Prototype prerelease

on:
  push:
    tags:
      - "v*-prototype.*"

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-prototype.')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            artifact: prototype-release-windows
            files: release/*.exe
          - os: macos-latest
            args: --mac dmg zip
            artifact: prototype-release-macos
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify prototype tag and package versions
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-prototype\.(0|[1-9]\d*)$/.test(version)
            || process.env.TAG_NAME !== `v${version}`
            || lock.version !== version || lock.packages?.['']?.version !== version) {
            throw new Error('Release requires a vX.Y.Z-prototype.N tag matching package.json and package-lock.json.');
          }
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Build installer
        run: npm run dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: prototype-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: |
          for file in *; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then
              test ! -e "$normalized"
              mv -- "$file" "$normalized"
            fi
          done
          sha256sum * > SHA256SUMS.txt
      - name: Publish prototype prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Miso $GITHUB_REF_NAME (Prototype)" \
            --notes-file docs/RELEASE_NOTES.md \
            release-assets/*
